name: Build Android APK

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout código
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Instalar Node.js 26 LTS
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: pnpm

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verificar entorno
        run: |
          node --version
          pnpm --version
          java -version

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar plataforma Android
        run: |
          test -d android || {
            echo "ERROR: No existe la carpeta android."
            exit 1
          }

      - name: Build web
        run: pnpm run build

      - name: Sync Capacitor
        run: pnpm exec cap sync android

      - name: Compilar APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug --stacktrace

      - name: Publicar APK en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Space Tech Studio ${{ github.ref_name }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}